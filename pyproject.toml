[project]
name = "shipaudit"
version = "0.1.0"
description = "Doi soat cuoc van tai 3PL - MUGVN Hackathon 2026"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pymongo>=4.7",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.35",
    "pandas>=2.2",
    "altair>=5.0",
    "ddtrace>=2.9",
    "datadog>=0.49",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "mongomock>=4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
