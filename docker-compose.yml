# Hạ tầng do A phụ trách. MongoDB dùng Atlas (MONGO_URI trong .env), không có container Mongo.
# Chạy: cp .env.example .env (điền MONGO_URI, DD_API_KEY) rồi `docker compose up --build`.
x-app: &app
  build:
    context: .
    dockerfile: app/Dockerfile
  env_file: .env
  environment: &app-env
    DD_AGENT_HOST: datadog-agent      # ddtrace và DogStatsD gửi về Agent trong compose
    DD_DOGSTATSD_PORT: "8125"
    DD_TRACE_AGENT_PORT: "8126"
    UPLOAD_DIR: /srv/data/uploads

services:
  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *app-env
      DD_SERVICE: shipaudit-api
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/srv/data/uploads   # file bảng kê đã nạp, giữ lại để truy vết
    depends_on:
      - datadog-agent
    healthcheck:
      # Ảnh python:slim không có curl nên dùng urllib.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "shipaudit-api"}]'

  worker:
    <<: *app
    # A5: nghe change stream của reconciliations, log JSON + metric khi có chênh lệch mới.
    command: python -m app.workers.change_stream
    environment:
      <<: *app-env
      DD_SERVICE: shipaudit-worker
    depends_on:
      - datadog-agent
    restart: unless-stopped
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "shipaudit-worker"}]'

  ui:
    <<: *app
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      <<: *app-env
      DD_SERVICE: shipaudit-ui
    ports:
      - "8501:8501"
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "shipaudit-ui"}]'

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-uk1.datadoghq.com}
      - DD_ENV=${DD_ENV:-dev}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    ports:
      - "8125:8125/udp"
      - "8126:8126"
